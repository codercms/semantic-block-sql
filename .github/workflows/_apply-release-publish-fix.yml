name: Apply release publish shell fix

on:
  push:
    branches:
      - agent/fix-release-publish-shell

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add missing shell terminator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-artifacts.yml')
          text = path.read_text()
          suffix = '              --title "$TAG"\n'
          if not text.endswith(suffix):
              raise SystemExit('unexpected release workflow ending')
          path.write_text(text + '          fi\n')
          PY

          rm .github/workflows/_apply-release-publish-fix.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-artifacts.yml .github/workflows/_apply-release-publish-fix.yml
          git commit -m "Fix release publishing shell block"
          git push origin HEAD:agent/fix-release-publish-shell
