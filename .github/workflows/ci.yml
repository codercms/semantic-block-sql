name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.88.0
          - stable

    env:
      CARGO_TERM_COLOR: always
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      BINDGEN_EXTRA_CLANG_ARGS: -resource-dir=/usr/lib/llvm-18/lib/clang/18

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Go toolchain for host-language integration tests
        uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            clang-18 \
            cmake \
            libclang-18-dev \
            pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" \
            --profile minimal \
            --component clippy \
            --component rustfmt
          rustup override set "${{ matrix.toolchain }}"
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        if: matrix.toolchain == '1.88.0'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: matrix.toolchain == '1.88.0'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build documentation
        if: matrix.toolchain == '1.88.0'
        run: cargo doc --locked --no-deps

      - name: Test deterministic release packaging
        if: matrix.toolchain == '1.88.0'
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          output_one="$(mktemp -d)"
          output_two="$(mktemp -d)"

          python3 -m py_compile .github/scripts/package_release.py

          for format in tar.gz zip; do
            python3 .github/scripts/package_release.py \
              --binary /bin/echo \
              --version 0.0.0-test \
              --target x86_64-test \
              --format "$format" \
              --output-dir "$output_one"

            python3 .github/scripts/package_release.py \
              --binary /bin/echo \
              --version 0.0.0-test \
              --target x86_64-test \
              --format "$format" \
              --output-dir "$output_two"
          done

          cmp "$output_one/semblock-0.0.0-test-x86_64-test.tar.gz" \
            "$output_two/semblock-0.0.0-test-x86_64-test.tar.gz"
          cmp "$output_one/semblock-0.0.0-test-x86_64-test.zip" \
            "$output_two/semblock-0.0.0-test-x86_64-test.zip"

          tar -tzf "$output_one/semblock-0.0.0-test-x86_64-test.tar.gz"
          python3 -m zipfile -t "$output_one/semblock-0.0.0-test-x86_64-test.zip"

      - name: Check patch whitespace
        if: matrix.toolchain == '1.88.0'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
          elif [[ "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git show --check --format=fuller "$PUSH_HEAD_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          fi
