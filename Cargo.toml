[package]
name = "semblock"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Semantic Block SQL formatter for PostgreSQL"
license = "MIT"
repository = "https://github.com/codercms/semantic-block-sql"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
ignore = "=0.4.31"
pg_query = "=6.1.1"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
similar = "=3.1.1"
syn = { version = "=2.0.119", default-features = false, features = ["derive", "parsing"] }
tempfile = "=3.27.0"
thiserror = "2.0"
toml = "=1.1.3"
tree-sitter = "=0.26.11"
tree-sitter-go = "=0.25.0"
tree-sitter-rust = "=0.24.2"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.dev.package.pg_query]
debug = 0
